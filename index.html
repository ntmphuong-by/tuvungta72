<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2e7d32; /* Xanh lá đậm */
            --secondary: #ff6f00; /* Cam đậm */
            --accent: #1565c0;
            --bg: #e8f5e9;
            --card-bg: #ffffff;
            --text: #37474f;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 60px; }

        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary), #66bb6a);
            color: white; padding: 15px 20px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 { margin: 0; font-size: 24px; font-weight: 800; }
        p { margin: 5px 0 0; opacity: 0.9; font-size: 14px; }

        /* CONTROLS */
        .controls {
            padding: 15px; text-align: center; position: sticky; top: 0; 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); z-index: 100;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        select {
            padding: 10px 20px; font-size: 16px; border-radius: 25px; border: 2px solid var(--primary);
            background: white; font-weight: bold; color: var(--text); outline: none; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }

        /* CONTAINER */
        .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }

        /* TABS */
        .tabs { display: flex; justify-content: center; margin-bottom: 25px; gap: 15px; }
        .tab-btn {
            padding: 12px 30px; border: none; background: white; border-radius: 30px;
            font-weight: 700; cursor: pointer; transition: 0.3s; color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 15px;
        }
        .tab-btn.active { background: var(--secondary); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 111, 0, 0.3); }

        /* FLASHCARD GRID */
        .flashcard-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card {
            background: transparent; height: 240px; perspective: 1000px; cursor: pointer;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s;
            transform-style: preserve-3d; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 15px; padding: 15px;
        }
        .card-front { background: white; color: var(--text); border: 2px solid #fff; }
        .card-back { background: var(--primary); color: white; transform: rotateY(180deg); border: 2px solid var(--primary); }
        
        .word { font-size: 20px; font-weight: 800; margin-bottom: 5px; color: var(--primary); }
        .pronounce { font-size: 14px; color: #777; font-style: italic; margin-bottom: 8px; font-family: 'Arial', sans-serif; }
        .type { font-size: 12px; background: #eee; padding: 3px 8px; border-radius: 6px; color: #555; font-weight: 600; margin-bottom: 10px; }
        .card-back .meaning { font-size: 18px; font-weight: 700; line-height: 1.4; }

        /* AUDIO BUTTON */
        .speak-btn {
            background: #fff; border: 2px solid #eee; border-radius: 50%;
            width: 40px; height: 40px; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; color: var(--primary); margin-top: 5px;
            z-index: 10;
        }
        .speak-btn:hover { background: #e8f5e9; border-color: var(--primary); transform: scale(1.1); }
        .speak-btn:active { transform: scale(0.9); }

        /* QUIZ MODE */
        .quiz-area { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; max-width: 600px; margin: 0 auto; }
        
        .q-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .q-word { font-size: 26px; font-weight: 800; color: var(--text); }
        
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .opt-btn {
            padding: 15px; background: #f9f9f9; border: 2px solid #eee; border-radius: 12px;
            font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: 600; color: #444;
        }
        .opt-btn:hover { background: #e3f2fd; border-color: var(--accent); color: var(--accent); }
        .opt-btn.correct { background: #c8e6c9; border-color: var(--primary); color: #1b5e20; }
        .opt-btn.wrong { background: #ffcdd2; border-color: #d32f2f; color: #b71c1c; opacity: 0.8; }
        
        .feedback { margin-top: 20px; font-weight: bold; height: 30px; font-size: 18px; }
        .score-board { margin-bottom: 20px; font-size: 20px; color: var(--secondary); font-weight: 800; }

        /* UTILS */
        .hidden { display: none; }
        .btn-restart {
            margin-top: 25px; padding: 12px 35px; background: var(--accent); color: white; border: none;
            border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }
        .btn-restart:hover { transform: translateY(-2px); }

        @media (max-width: 600px) {
            .flashcard-container { grid-template-columns: 1fr 1fr; }
            .card { height: 220px; }
            .word { font-size: 16px; }
        }
    </style>
</head>

    let currentUnit = 1;
    let score = 0;
    let currentQuizIndex = 0;
    let quizData = [];

    // INIT
    window.onload = () => {
        loadUnit();
    };

    function loadUnit() {
        currentUnit = parseInt(document.getElementById('unit-select').value);
        renderFlashcards();
        setMode('learn');
    }

    function setMode(mode) {
        document.getElementById('learn-mode').classList.toggle('hidden', mode !== 'learn');
        document.getElementById('quiz-mode').classList.toggle('hidden', mode !== 'quiz');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        if(mode === 'quiz') startQuiz();
    }

    /* AUDIO FUNCTIONS */
    function speakWord(text, e) {
        if(e) e.stopPropagation();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }

    function speakCurrentQuiz() {
        const word = document.getElementById('q-text').innerText;
        speakWord(word);
    }

    /* FLASHCARD LOGIC */
    function renderFlashcards() {
        const container = document.getElementById('flashcards');
        container.innerHTML = '';
        const words = db[currentUnit];
        words.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="word">${item.w}</div>
                        <div class="type">${item.t}</div>
                        <button class="speak-btn" onclick="speakWord('${item.w.replace(/'/g, "\\'")}', event)">🔊</button>
                        <div style="font-size:12px; margin-top:15px; color:#999; font-style:italic">Chạm để lật</div>
                    </div>
                    <div class="card-back">
                        <div class="meaning">${item.m}</div>
                    </div>
                </div>
            `;
            card.onclick = () => card.classList.toggle('flipped');
            container.appendChild(card);
        });
    }

    /* QUIZ LOGIC */
    function startQuiz() {
        score = 0;
        currentQuizIndex = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');
        
        let words = [...db[currentUnit]];
        quizData = words.sort(() => 0.5 - Math.random()); 
        showQuestion();
    }

    function showQuestion() {
        if(currentQuizIndex >= quizData.length) {
            document.querySelector('.quiz-area').innerHTML = `
                <h2 style="color:var(--secondary)">🏆 Hoàn thành!</h2>
                <p style="font-size:20px">Điểm số: <b>${score} / ${quizData.length * 10}</b></p>
                <button class="btn-restart" onclick="location.reload()">Chọn bài khác</button>
            `;
            return;
        }

        const item = quizData[currentQuizIndex];
        document.getElementById('q-text').innerText = item.w;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');
        
        // Tạo đáp án
        const correctMean = item.m;
        let options = [correctMean];
        
        let otherWords = db[currentUnit].filter(x => x.w !== item.w);
        if(otherWords.length < 3) {
            let backupWords = db[1].filter(x => x.w !== item.w);
            otherWords = otherWords.concat(backupWords);
        }
        
        let shuffledOthers = otherWords.sort(() => 0.5 - Math.random()).slice(0, 3);
        shuffledOthers.forEach(x => options.push(x.m));
        
        options.sort(() => 0.5 - Math.random());

        const optContainer = document.getElementById('q-options');
        optContainer.innerHTML = '';
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, correctMean);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected, correct) {
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true);

        if(selected === correct) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerText = "Chính xác! 🎉";
            document.getElementById('feedback').style.color = "var(--primary)";
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedback').innerText = `Sai rồi! Đáp án: ${correct}`;
            document.getElementById('feedback').style.color = "#d32f2f";
            btns.forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuizIndex++;
        showQuestion();
    }
</script>
